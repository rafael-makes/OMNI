# =============================================================================
# nav2_params.yaml — Nav2 configuration for OMNI robot
# =============================================================================
#
# OMNI physical dimensions:
#   Body: 600mm wide × 400mm deep × 880mm tall
#   Footprint (half-widths): ±0.30m left/right, ±0.20m front/back
#   Inflation radius: 0.55m (footprint diagonal 0.36m + 0.19m safety buffer)
#   Max linear speed: 0.3 m/s  (top-heavy — keep it slow for nav)
#   Max angular speed: 1.2 rad/s
#   Min driveable speeds (MIN_PWM=35, 10kg motors):
#     linear:  ~0.11 m/s  (35/16.4 FF_GAIN × 0.053m radius)
#     angular: ~0.75 rad/s (each wheel needs ≥ 0.11 m/s tangential)
#   DWB must not command below these floors or motors cut out.
#   Environment: indoor home — hallways, furniture, doorways
#
# TF tree:
#   map → odom (published by slam_toolbox via slam_node)
#   odom → base_link (published by motor_control_node)
#   base_link → lidar_link (static transform in slam_launch.py, z=0.38m)
#
# cmd_vel:
#   controller_server publishes to /cmd_vel → motor_control_node directly.
#

# =============================================================================


# =============================================================================
# BT Navigator — the top-level coordinator
# =============================================================================
# bt_navigator receives goal poses (from /goal_pose or the NavigateToPose
# action server) and runs a behavior tree that calls planner_server and
# controller_server to execute the navigation. It does NOT directly publish
# velocity — it delegates that to controller_server.
bt_navigator:
  ros__parameters:
    # global_frame: the fixed world frame — must match slam_toolbox's map frame
    global_frame: map

    # robot_base_frame: the moving robot frame — must match motor_control_node
    robot_base_frame: base_link

    # odom_topic: wheel odometry direct — EKF disabled (too slow on Pi 5)
    odom_topic: /odom

    # bt_loop_duration: how often the behavior tree ticks (ms)
    # 10ms = 100Hz. Lower = more responsive, higher CPU cost.
    bt_loop_duration: 10

    # default_server_timeout: seconds to wait for action servers to respond
    # before declaring failure. 20s is generous for a Pi 5.
    default_server_timeout: 20

    # wait_for_service_timeout: seconds to wait for lifecycle services
    wait_for_service_timeout: 1000

    # action_server_result_timeout: seconds to hold a completed action result
    action_server_result_timeout: 900.0

    # navigators: which navigator plugins to load
    # NavigateToPose: single goal navigation (used by send_goal.py)
    # NavigateThroughPoses: waypoint following (for future use)
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    # Use simpler BT — no spin/backup recovery (stall_recovery_node handles that)
    default_nav_to_pose_bt_xml: "/home/pi/omni_ws/install/nav2_bt_navigator/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_only_if_path_becomes_invalid.xml"

    # error_code_names: which error codes to report in feedback
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code


# =============================================================================
# Planner Server — global path planning
# =============================================================================
# planner_server takes a goal pose and the current map, and computes a
# globally optimal path from the robot's current position to the goal.
# It publishes the path on /plan (nav_msgs/Path). It does NOT move the robot.
#
# We use NavFn with A* — this is the simplest and most reliable planner for
# indoor environments with a known occupancy grid map. It works well in
# home environments (hallways, rooms, doorways).
#
# Alternatives:
#   Smac Planner: more sophisticated, handles non-holonomic constraints,
#                 but requires more tuning and is slower on Pi 5.
#   THETA*: any-angle paths, smoother but more CPU intensive.
# NavFn A* is the right choice for OMNI at this stage.
planner_server:
  ros__parameters:
    # planner_plugins: list of planners to load. Each is a named plugin.
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      # tolerance: how close to the goal (meters) counts as "reached"
      # 0.5m is generous — good for furniture-filled rooms where exact
      # positioning is not required. Tighten if you need precise docking.
      tolerance: 0.5

      # use_astar: true = A* (goal-directed, faster), false = Dijkstra
      # A* is strongly preferred for single-goal navigation.
      use_astar: true

      # allow_unknown: true = plan through unexplored (grey) map cells
      # Indoor SLAM often leaves some cells unknown at room edges.
      # Allowing unknown means OMNI can still plan through partially mapped areas.
      allow_unknown: true


# =============================================================================
# Controller Server — local path following
# =============================================================================
# controller_server takes the global path from planner_server and computes
# velocity commands to follow it, while avoiding dynamic obstacles.
# It publishes to /cmd_vel (remapped to /cmd_vel_raw in the launch file).
#
# We use DWB (Dynamic Window Approach Based) controller. DWB samples many
# possible velocity trajectories, scores them against "critic" functions,
# and picks the best one. It is the Nav2 default and well-suited for indoor
# differential-drive robots like OMNI.
controller_server:
  ros__parameters:
    # controller_frequency: how often to compute and publish velocity (Hz)
    # 10 Hz is appropriate for a slow indoor robot. 20 Hz is the max
    # the LD19 LiDAR can support anyway.
    controller_frequency: 5.0

    # These thresholds prevent publishing tiny velocities that the motors
    # cannot actually execute (hardware deadband protection).
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # failure_tolerance: seconds of controller failure before declaring
    # navigation failed. At 5Hz, 0.3s = only 1 attempt before abort.
    # 3.0s gives ~15 control cycles to find a valid trajectory before giving up.
    failure_tolerance: 3.0

    # progress_checker_plugins: monitors whether the robot is making progress
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_movement_radius: lowered 0.5→0.3m — slow progress through tight
      # spots and doorways still counts, prevents false "stuck" declarations.
      required_movement_radius: 0.3
      # movement_time_allowance: raised to 45s — accounts for stall recovery cycles
      # (~3s each), TF gap events, and slow progress through narrow passages.
      movement_time_allowance: 45.0

    # goal_checker_plugins: decides when the robot has "arrived"
    goal_checker_plugin: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      # These tolerances define what counts as "at the goal"
      # xy_goal_tolerance: distance (m) — must be within this of goal XY
      xy_goal_tolerance: 0.25
      # yaw_goal_tolerance: angle (radians) — must face within this of goal yaw.
      # 6.28 rad = full circle = heading-free. OMNI arrives without spinning.
      # Tighten (e.g. 0.2 rad) only when precise docking heading matters.
      yaw_goal_tolerance: 6.28
      # stateful: true = stop immediately when within tolerance
      stateful: true

    # controller_plugins: which controller algorithm to use
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # ── Velocity limits for OMNI ──────────────────────────────────────────
      # These are the hard limits. DWB will never command outside these bounds.
      # OMNI is top-heavy so we keep speeds conservative.

      # max_vel_x: maximum forward speed (m/s)
      # 0.3 m/s ≈ 1 km/h — comfortable for indoor navigation without tipping
      max_vel_x: 0.3

      # min_vel_x: negative value allows reversing.
      # -0.15 m/s gives DWB a backup option when forward paths are blocked.
      # MIN_PWM floor still applies — motor_control_node clips anything below
      # its deadband, so very slow reverse commands may not move the robot,
      # but allowing negative values lets DWB choose to back up in tight spots.
      min_vel_x: -0.15

      # max_vel_y: OMNI is NOT holonomic (cannot strafe), so y vel = 0
      max_vel_y: 0.0
      min_vel_y: 0.0

      # max_vel_theta: maximum rotation speed (rad/s)
      # 1.5 rad/s — gives DWB a wide range (0.8→1.5) to avoid binary +/- oscillation
      max_vel_theta: 1.5
      min_vel_theta: 0.0

      # max_speed_xy: upper bound on combined xy speed (redundant safety limit)
      max_speed_xy: 0.3

      # min_speed_xy: raised to match MIN_PWM=50 floor (~0.163 m/s)
      min_speed_xy: 0.17

      # min_speed_theta: MIN_PWM=50 → each wheel ~0.163 m/s → angular floor
      # = 0.163 / (track/2) = 0.163 / 0.1525 = 1.07 rad/s. 1.1 gives margin.
      min_speed_theta: 1.1

      # ── Acceleration limits ───────────────────────────────────────────────
      # OMNI is top-heavy — gentle acceleration prevents tipping.

      # acc_lim_x: maximum linear acceleration (m/s²)
      # 0.5 m/s² gives a smooth start — reaches max speed in 0.6 seconds
      acc_lim_x: 0.5

      # acc_lim_y: no lateral acceleration (non-holonomic)
      acc_lim_y: 0.0

      # acc_lim_theta: maximum angular acceleration (rad/s²)
      # 1.0 rad/s² is gentle — reaches max turn speed in 0.8 seconds
      acc_lim_theta: 1.0

      # decel_lim_x: maximum deceleration (negative = braking)
      # Match acc_lim_x for symmetric stopping
      decel_lim_x: -0.5
      decel_lim_theta: -1.0

      # ── DWB sampling ──────────────────────────────────────────────────────
      # DWB generates sample trajectories by trying different velocities and
      # simulating forward in time. More samples = better choices, more CPU.

      # vx_samples: how many forward velocity values to try
      # 10 is enough for a slow robot with 0.3 m/s max
      vx_samples: 10

      # vy_samples: no lateral motion, so 1 sample (always 0)
      vy_samples: 1

      # vtheta_samples: how many angular velocity values to try
      # 20 gives good coverage of the 0–0.8 rad/s range
      vtheta_samples: 20

      # sim_time: how far ahead (seconds) to simulate each trajectory
      # 0.8s: reduced from 1.2s to prevent DWB from seeing the goal through
      # the wall and arcing diagonally toward it (doorway corner-cutting).
      sim_time: 0.8

      # linear_granularity: simulation step size (m)
      linear_granularity: 0.05

      # angular_granularity: simulation angular step size (radians)
      angular_granularity: 0.025

      # transform_tolerance: maximum age (seconds) of TF transforms to accept
      transform_tolerance: 0.2

      # xy_goal_tolerance / yaw_goal_tolerance: same as goal_checker above
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 6.28

      # ── DWB critics (scoring functions) ──────────────────────────────────
      # Each critic scores a trajectory from 0 to 255. DWB picks the
      # trajectory with the highest combined score. Critics penalize:
      #   - getting close to obstacles
      #   - oscillating back and forth
      #   - deviating from the global path
      #   - facing away from the path/goal
      critics:
        ["Oscillation", "BaseObstacle",
         "PathAlign", "PathDist", "GoalDist"]

      # RotateToGoal removed — free heading (yaw_goal_tolerance=360°).
      # GoalAlign removed — caused 1-2 full rotations at goal arrival trying
      #   to face yaw=0 (default goal heading). No meaningful goal orientation
      #   with free-heading nav.
      # PathAlign restored at reduced scale — was removed when EKF heading
      #   mismatch caused spinning at path start. With raw wheel odometry the
      #   heading is consistent with the map so PathAlign should behave.
      #   Reduced 16→8 to soften the alignment pull without causing pre-spin.

      # Oscillation: penalizes switching directions repeatedly (getting stuck)
      # Raised 1.0→5.0 — stronger penalty discourages the +/- rotation
      # switching that was observed when DWB had a narrow angular velocity band.
      Oscillation.scale: 5.0

      # BaseObstacle: checks costmap cost at the robot center point only.
      # Replaced ObstacleFootprint (full polygon check) — the polygon check
      # rejected all trajectories in rooms with scattered furniture because the
      # 0.60m×0.40m footprint clipped nearby chair legs/desk edges at every step.
      # Scale raised 0.02→0.08: with local inflation_radius=0.28m (arm extent),
      # obstacles near arm tips now produce cost ~169 at robot center, and this
      # scale makes that penalty meaningful in trajectory scoring.
      BaseObstacle.scale: 0.08

      # PathDist: penalizes trajectories that drift far from the global path
      # Raised 32→48: stronger pull keeps robot in doorway corridor instead
      # of cutting diagonally toward the goal.
      PathDist.scale: 48.0

      # GoalDist: rewards trajectories that move toward the goal
      GoalDist.scale: 24.0

      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.1



# =============================================================================
# Behavior Server — recovery behaviors
# =============================================================================
# When navigation gets stuck (obstacle blocking path, robot lost, etc.),
# the behavior server runs recovery actions. These are triggered by the
# behavior tree in bt_navigator.
#
# Recovery sequence (default BT): Spin → Backup → Wait → Spin → Backup → Fail
behavior_server:
  ros__parameters:
    # These topics must match what the behavior plugins read from
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint

    # cycle_frequency: how often to run the behavior control loop (Hz)
    cycle_frequency: 10.0

    # behavior_plugins: spin kept so default BT XML can find the action server,
    # but bt_navigator uses a custom BT without spin (see default_nav_to_pose_bt_xml).
    behavior_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"

    # simulate_ahead_time: seconds to simulate before executing the behavior
    # to check if it will hit an obstacle. 2.0s is the default.
    simulate_ahead_time: 2.0

    # Spin parameters: OMNI rotates in place to see new surroundings
    # spin_dist: how far to rotate (radians) — 1.57 = 90 degrees
    spin_dist: 1.57

    # Backup parameters: OMNI moves backward a short distance
    # backup_dist: how far to back up (meters)
    backup_dist: 0.30
    # backup_speed: must be above MIN_PWM=35 floor (~0.11 m/s). 0.18 gives margin.
    backup_speed: 0.18

    # transform_tolerance: max TF age to accept during recovery
    transform_tolerance: 0.1


# =============================================================================
# Smoother Server — path smoothing
# =============================================================================
# The smoother refines the global path from the planner to remove sharp
# corners and reduce unnecessary turns. For OMNI (differential drive in
# a home environment), smoothing improves comfort and reduces oscillation.
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # tolerance: how much the path can deviate from the original (m)
      tolerance: 1.0e-10
      # max_its: maximum smoothing iterations per call
      max_its: 1000
      # w_data: weight for keeping path close to original waypoints
      w_data: 0.2
      # w_smooth: raised 0.3→0.5 — smoother path transitions reduce the jolt
      # when a new global plan is handed to the controller.
      w_smooth: 0.5
      # do_refinement: whether to iteratively refine after initial smooth
      do_refinement: True


# =============================================================================
# Global Costmap — obstacle map for global path planning
# =============================================================================
# The global costmap covers the entire known map area. The planner uses it
# to find paths that avoid walls and obstacles from the start position to goal.
#
# Layers:
#   static_layer:   loads the SLAM-built occupancy grid map (/map)
#   obstacle_layer: marks dynamic obstacles seen by the LiDAR (/scan)
#   inflation_layer: inflates obstacles by a safety margin around the footprint
global_costmap:
  global_costmap:
    ros__parameters:
      # update_frequency: 1.0 Hz — 0.5Hz was too slow, caused planner timeouts
      update_frequency: 1.0

      # publish_frequency: match update rate
      publish_frequency: 1.0

      # global_frame: the map frame — matches slam_toolbox output
      global_frame: map

      # robot_base_frame: the robot's center frame
      robot_base_frame: base_link

      # use_sim_time: must match the launch argument
      use_sim_time: False

      # Global costmap uses a small PLANNING radius (NOT the physical footprint).
      # The physical body is 0.20m half-width but the SLAM-mapped walls appear
      # several cells thick (LiDAR multi-scan overlap), so even 0.20m inflation
      # makes doorways appear completely blocked. We use 0.15m so the planner
      # can route through real doorways (~70cm+). The local costmap and DWB
      # controller handle actual collision avoidance with the full footprint.
      robot_radius: 0.15

      # resolution: costmap cell size (meters). Must match the SLAM map
      # resolution (0.05m = 5cm cells) for consistent obstacle marking.
      resolution: 0.05

      # track_unknown_space: true = treat unexplored cells as potentially free
      # (allows planning through unmapped areas during active SLAM)
      track_unknown_space: true

      # plugins: which costmap layers to load, in order
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # map_subscribe_transient_local: true = use transient-local QoS to
        # receive the last published /map even if we subscribe after it published
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # enabled: allows disabling this layer for debugging
        enabled: True
        # observation_sources: named sensors that report obstacles
        observation_sources: scan
        scan:
          # topic: where to read LaserScan data — lidar_node publishes here
          topic: /scan
          # max_obstacle_height: ignore points above this (avoids ceiling hits)
          max_obstacle_height: 2.0
          # clearing: true = LiDAR free-space beams clear previous obstacles
          # This is important — without it, obstacles that moved stay forever
          clearing: True
          # marking: true = LiDAR hits mark new obstacles
          marking: True
          # data_type: LaserScan format
          data_type: "LaserScan"
          # raytrace_max_range: maximum range to use for clearing free space (m)
          # LD19 max range is 12m but 5m is reliable indoors
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          # obstacle_max_range: maximum range to mark as obstacle (m)
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor: 2.5 — broad cost gradient pushes path toward
        # doorway center without making the passage too narrow for NavFn.
        cost_scaling_factor: 2.5
        # inflation_radius: 0.12m — reduced from 0.22m which was blocking plans
        # in rooms with furniture. Global costmap only needs enough inflation to
        # keep the planner away from walls; local costmap + DWB handle real-time
        # collision avoidance with the full footprint.
        inflation_radius: 0.12


# =============================================================================
# Local Costmap — obstacle map for local path following
# =============================================================================
# The local costmap is a small window around the robot, updated at high
# frequency. The DWB controller uses it to avoid dynamic obstacles in real time.
# It does NOT use the static map layer — it only sees what the LiDAR sees NOW.
#
# Layers:
#   obstacle_layer: marks dynamic obstacles from current LiDAR scan
#   inflation_layer: inflates them for safe footprint clearance
local_costmap:
  local_costmap:
    ros__parameters:
      # update_frequency: how often to update the local costmap (Hz)
      # 5 Hz balances reactivity with Pi 5 CPU budget.
      # The LiDAR publishes at 10 Hz so 5 Hz gives us fresh data each update.
      update_frequency: 5.0

      # publish_frequency: how often to publish for RViz
      publish_frequency: 2.0

      # global_frame: local costmap moves with odom frame (not map)
      # Using odom avoids costmap jumps when slam_toolbox corrects the map.
      global_frame: odom

      # robot_base_frame: same as global costmap
      robot_base_frame: base_link

      use_sim_time: False

      # rolling_window: true = the local costmap follows the robot
      rolling_window: true

      # width/height: size of the local costmap window (meters)
      # 4m × 4m gives ~2m visibility in each direction — enough for indoor nav
      # and appropriate for OMNI's 0.3 m/s max speed (covers 2+ seconds ahead)
      width: 4
      height: 4

      # resolution: same as global costmap for consistent obstacle sizes
      resolution: 0.05

      # Rectangular footprint covering arms bent at 90°:
      #   Body: 600mm wide × 400mm deep
      #   Front: 0.20m body + 0.15m arms = 0.35m
      #   Rear: reduced to 0.05m — robot can safely back to within 50mm of a wall.
      #   With inflation_radius=0.15m, total rear clearance = 0.05+0.15 = 0.20m from base_link.
      #   This lets the robot back out of hallways and tight spots before turning.
      footprint: "[[0.35, 0.30], [0.35, -0.30], [-0.05, -0.30], [-0.05, 0.30]]"

      # No static_layer here — the local costmap is purely sensor-driven.
      # This means it reacts to dynamic obstacles (people, chairs, pets)
      # without being confused by the static map.
      #
      # No static_layer here — the local costmap is purely sensor-driven.
      # This means it reacts to dynamic obstacles (people, chairs, pets)
      # without being confused by the static map.
      plugins: ["obstacle_layer", "range_sensor_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0

      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        topics: ["/tof/left", "/tof/front_left", "/tof/front_right",
                 "/tof/right", "/tof/left_rear", "/tof/right_rear"]
        phi: 0.5
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        # Reduced 0.20→0.15m: 0.20m was too aggressive — when the robot was
        # near a wall (common after entering a room), inflation marked ALL
        # trajectories lethal, causing instant goal failure. 0.15m still provides
        # clearance but leaves enough free space for DWB to sample valid paths.
        inflation_radius: 0.15


# =============================================================================
# Map Server — serves a pre-saved map for localization-only mode
# =============================================================================
# NOTE: map_server is NOT started by nav_launch.py when running with slam_node.
# slam_toolbox publishes /map live during SLAM. map_server is only needed
# if you want to navigate against a previously saved map without running SLAM.
#
# To use a saved map:
#   1. Save the current map: ros2 run nav2_map_server map_saver_cli -f ~/my_map
#   2. Create a separate localization launch that starts map_server + amcl
#   3. Do NOT run slam_node at the same time
#
# This section is included for reference — the parameters are correct but
# map_server is not in nav_launch.py's lifecycle_manager node_names list.
map_server:
  ros__parameters:
    use_sim_time: False
    # yaml_filename: path to the saved map YAML file
    # Update this path when you save a map
    yaml_filename: ""


# =============================================================================
# Lifecycle Manager — manages Nav2 node state transitions
# =============================================================================
# The lifecycle_manager is responsible for starting all Nav2 nodes and
# transitioning them through the ROS2 lifecycle: unconfigured → configured
# → active. If a node crashes, lifecycle_manager will shut down the rest.
#
# This is NOT the same as the OMNI nodes (motor_control, imu, etc.) which
# are regular (non-lifecycle) nodes. Nav2 specifically requires lifecycle nodes
# because startup order matters — you cannot start the controller before the
# costmap is ready.
lifecycle_manager:
  ros__parameters:
    use_sim_time: False

    # autostart: true = immediately transition all nodes to active on launch.
    # Set to false if you want to manually trigger activation (for debugging).
    autostart: True

    # node_names: the Nav2 nodes this lifecycle_manager controls.
    # ORDER MATTERS: dependencies must come before the things that depend on them.
    #   planner_server and controller_server depend on costmaps being ready.
    #   bt_navigator depends on planner_server and controller_server being active.
    node_names:
      - planner_server
      - smoother_server
      - controller_server
      - behavior_server
      - bt_navigator

    # bond_timeout: seconds before lifecycle_manager declares a node dead
    # if it stops sending bond heartbeats. 4.0s is the Nav2 default.
    bond_timeout: 4.0

    # attempt_respawn_reconnection: if a node dies, try to reconnect to it
    # if it respawns (e.g., if launched with --respawn option)
    attempt_respawn_reconnection: True
