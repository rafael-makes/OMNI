slam_toolbox:
  ros__parameters:

    # ── Plugin/solver ────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Frames ───────────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true

    # ── Mode ─────────────────────────────────────────────────────────────────
    mode: localization   # mapping | localization
    autostart: true

    # ── Map persistence ──────────────────────────────────────────────────────
    # Serialize the pose graph to disk every N seconds (0 = disabled)
    map_file_name: /home/pi/omni_ws/maps/omni_home_map
    map_start_at_dock: true

    # ── Scan matching ────────────────────────────────────────────────────────
    # LD19: 10 Hz, 360°, ~5m range indoors
    debug_logging: false
    throttle_scans: 1               # process every scan
    transform_publish_period: 0.05  # 20 Hz TF publish
    map_update_interval: 5.0        # rebuild occupancy grid every 5s
    resolution: 0.025               # 2.5cm/cell — matches mapping resolution
    max_laser_range: 10.0           # LD19 max range is ~12m; 10m is safe indoors
    minimum_travel_distance: 0.05   # update after 5cm movement
    minimum_travel_heading: 0.1     # update after ~6° rotation
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # Link matching distance thresholds — tuned for moderate home odometry
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5   # max range for adding scan links

    # Loop closure
    do_loop_closing: true
    loop_search_space_dimension: 8.0
    loop_search_maximum_distance: 0.3
    loop_match_minimum_response_coarse: 0.35
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_fine: 0.45
    loop_match_maximum_variance_fine: 0.5

    # ── Correlation parameters ────────────────────────────────────────────────
    # Search window size at coarse/fine passes — larger is slower but more robust
    # 1.5m dimension = ±0.75m search window; handles clicks ~0.5m off true pose
    correlation_search_space_dimension: 1.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Lifecycle / bond ─────────────────────────────────────────────────────
    enable_interactive_mode: false  # no RViz on Pi

    # ── TF ───────────────────────────────────────────────────────────────────
    # slam_toolbox will publish map→odom TF internally
    # base_link→laser_frame is handled by static_transform_publisher in launch
    tf_buffer_duration: 30.0

    # ── Pose graph serialization ──────────────────────────────────────────────
    paused_new_measurements: false
